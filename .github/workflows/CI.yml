name: Test and Build

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/*.yaml"
      - "**/*.yml"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/*.yaml"
      - "**/*.yml"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/**"

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Cache Go modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Filter coverage report
        run: |
          grep -v "github.com/KAnggara75/HeartBeat/cmd/heartbeat" coverage.out > coverage.tmp && mv coverage.tmp coverage.out || true

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"
          THRESHOLD=30
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build -v -ldflags="-w -s" -o bin/heartbeat ./cmd/heartbeat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-binary
          path: bin/heartbeat
          retention-days: 1

  dockerbuild:
    runs-on: ubuntu-24.04
    needs: [test, build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    name: Build and Push to Docker Hub
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: KAnggara/DevOps/dockerbuild@v0.1.13
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tag_strategy: run_number